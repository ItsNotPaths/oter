name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

# Linux only: the PTY layer is POSIX.

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Built in release.Dockerfile for an old glibc floor.
      - name: Build release image
        run: docker build -f release.Dockerfile -t oter-release .

      - name: Cache vendor (el8)
        uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-el8-${{ hashFiles('download-deps.sh', 'release.Dockerfile', 'patches/**') }}

      - name: Build
        run: >
          docker run --rm -v "$PWD:/work" oter-release
          sh -c './download-deps.sh && ./release.sh --local --tarball'

      - uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: dist

  release:
    needs: [build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-assets
          path: dist

      # install.sh rides along raw: the curl one-liner fetches it by name.
      # No checkout here, so GH_REPO names the repo and --target pins the tag.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$VERSION" \
              dist/*.tar.gz dist/install.sh \
              --target "${{ github.sha }}" \
              --title "$VERSION" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG
